# ══════════════════════════════════════════════════════════════════════════════
# GitHub Actions – Minecraft Mod Release Workflow
#
# Tag Format: <mc-version>-v<mod-version>  (e.g., 1.21.1-v0.001, 1.21.1-v1.0.0)
#
# Release Rules:
#   - Tag matching *-v0.* (e.g. 1.21.1-v0.001) → Published as Pre-release (prerelease: true)
#   - Tag matching *-v1.* or higher           → Published as Stable Release (prerelease: false)
#   - Automatic header with release tag link and release date: YYYY-MM-DD
#   - Native GitHub "What's Changed" notes via generate_release_notes: true
#   - Markdown "Built with" table detailing MC, NeoForge, Fabric Loader, Fabric API
#   - Asset upload of final compiled .jar files (excluding -sources, -dev, -shadow)
# ══════════════════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags:
      - "*-v*"        # matches: 1.21.1-v0.001, 1.21.1-v0.002, 1.21.1-v1.0.0
      - "v*"          # matches: v0.001, v1.0.0

permissions:
  contents: write    # required to create GitHub releases and upload assets

env:
  JAVA_VERSION: "21"
  GRADLE_OPTS: "-Xmx3G -Dfile.encoding=UTF-8"

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout full history ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Set up Java JDK 21 with Gradle Cache ────────────────────────────
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      # ── 3. Make Gradle wrapper executable ──────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 4. Parse Versions & Determine Pre-release State ────────────────────
      - name: Parse Metadata & Version Info
        id: metadata
        run: |
          # Helper: extract value from gradle.properties
          prop() { grep -E "^${1}\s*=" gradle.properties | sed 's/.*=\s*//' | tr -d '\r'; }

          MC_VERSION="$(prop minecraft_version)"
          NEO_VERSION="$(prop neo_version)"
          MOD_VERSION="$(prop mod_version)"

          # Extract Fabric Loader & API versions from fabric-1.21.1/build.gradle
          FABRIC_LOADER="$(grep -oP 'fabric-loader:\K[0-9][^\\"]+' fabric-1.21.1/build.gradle | head -1 | tr -d '\r')"
          FABRIC_API="$(grep -oP 'fabric-api:\K[0-9][^"]+' fabric-1.21.1/build.gradle | head -1 | tr -d '\r')"

          TAG="${GITHUB_REF_NAME}"
          TODAY="$(date +'%Y-%m-%d')"
          REPO="${GITHUB_REPOSITORY}"

          # Pre-release logic: Any tag containing 'v0.' (e.g. 1.21.1-v0.001, v0.002) is a Pre-release
          if [[ "$TAG" =~ -?[vV]0\. ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          echo "tag=${TAG}"                             >> "$GITHUB_OUTPUT"
          echo "today=${TODAY}"                         >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}"                           >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRERELEASE}"           >> "$GITHUB_OUTPUT"
          echo "mc_version=${MC_VERSION}"               >> "$GITHUB_OUTPUT"
          echo "neo_version=${NEO_VERSION}"             >> "$GITHUB_OUTPUT"
          echo "fabric_loader=${FABRIC_LOADER}"         >> "$GITHUB_OUTPUT"
          echo "fabric_api=${FABRIC_API}"               >> "$GITHUB_OUTPUT"

          echo "Parsed metadata:"
          echo "  Tag          : ${TAG}"
          echo "  Release Date : ${TODAY}"
          echo "  Is Prerelease: ${IS_PRERELEASE}"
          echo "  Minecraft    : ${MC_VERSION}"
          echo "  NeoForge     : ${NEO_VERSION}"
          echo "  Fabric Loader: ${FABRIC_LOADER}"
          echo "  Fabric API   : ${FABRIC_API}"

      # ── 5. Compile & Build Mod Artifacts ───────────────────────────────────
      - name: Build with Gradle
        run: ./gradlew build --no-daemon --warning-mode=all

      # ── 6. Generate Release Body ───────────────────────────────────────────
      - name: Prepare Release Description
        id: prepare_body
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          TODAY: ${{ steps.metadata.outputs.today }}
          REPO: ${{ steps.metadata.outputs.repo }}
          MC_VERSION: ${{ steps.metadata.outputs.mc_version }}
          NEO_VERSION: ${{ steps.metadata.outputs.neo_version }}
          FABRIC_LOADER: ${{ steps.metadata.outputs.fabric_loader }}
          FABRIC_API: ${{ steps.metadata.outputs.fabric_api }}
        run: |
          {
            echo "## [${TAG}](https://github.com/${REPO}/releases/tag/${TAG}) (${TODAY})"
            echo ""
            echo "### 🧱 Built with"
            echo ""
            echo "| Component | Version |"
            echo "|-----------|---------|"
            echo "| 🟫 Minecraft | \`${MC_VERSION}\` |"
            echo "| 🟠 NeoForge | \`${NEO_VERSION}\` |"
            echo "| 🔵 Fabric Loader | \`${FABRIC_LOADER}\` |"
            echo "| 🟢 Fabric API | \`${FABRIC_API}\` |"
            echo ""
            echo "> **Java ${{ env.JAVA_VERSION }}** required."
            echo ""
          } > /tmp/release_body.md

          echo "Generated body prefix:"
          cat /tmp/release_body.md

      # ── 7. Publish GitHub Release with Assets ──────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.tag }}
          body_path: /tmp/release_body.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.metadata.outputs.prerelease == 'true' }}
          files: |
            fabric-1.21.1/build/libs/elevatorslabs-*.jar
            neoforge-1.21.1/build/libs/elevatorslabs-*.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
