modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/openslabs/elevatorslabs/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''${mod_description}'''
authors = "${mod_authors}"

# NeoForge Dependency
[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    mandatory = true
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Minecraft Dependency (1.21.1)
[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Base Mod: OpenBlocks Elevator (elevatorid)
[[dependencies.${mod_id}]]
    modId = "elevatorid"
    type = "required"
    mandatory = true
    versionRange = "${elevatorid_version_range}"
    ordering = "AFTER"
    side = "BOTH"
